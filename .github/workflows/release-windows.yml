name: Release Windows x64

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit (empty uses this workflow commit)
        type: string
        required: false
      dependencies_run:
        description: Successful dependency run for this source (empty builds dependencies)
        type: string
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  # Public credentials already used by this repository's nightly builds.
  TDESKTOP_API_ID: '611335'
  TDESKTOP_API_HASH: d524b414d21f4d37f08684c1df41ac9c

jobs:
  dependencies:
    if: inputs.dependencies_run == ''
    name: Windows dependencies
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          sparse-checkout: .github/actions/release-windows-setup
          persist-credentials: false
      - name: Validate source commit
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          path: tdesktop
      - uses: ./automation/.github/actions/release-windows-setup
      - name: Build dependencies for Debug and Release
        shell: cmd
        run: call tdesktop\Telegram\build\prepare\win.bat silent qt6
      - name: Archive completed dependencies
        shell: bash
        run: tar --use-compress-program='zstd -T0 -3' --force-local -cf "$RUNNER_TEMP/windows-dependencies.tar.zst" Libraries ThirdParty
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-dependencies
          path: ${{ runner.temp }}/windows-dependencies.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows x64
    needs: dependencies
    if: ${{ !cancelled() && (needs.dependencies.result == 'success' || (needs.dependencies.result == 'skipped' && inputs.dependencies_run != '')) }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: automation
          sparse-checkout: .github/actions/release-windows-setup
          persist-credentials: false
      - name: Validate source commit
        shell: bash
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          path: tdesktop
      - uses: ./automation/.github/actions/release-windows-setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-dependencies
          path: ${{ runner.temp }}/dependencies
          run-id: ${{ inputs.dependencies_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore completed dependencies
        shell: bash
        run: |
          archive="$RUNNER_TEMP/dependencies/windows-dependencies.tar.zst"
          if ! tar --use-compress-program='zstd -d' --force-local -xf "$archive"; then
            echo 'Retrying extraction after restoring forward symlink targets.'
            tar --use-compress-program='zstd -d' --force-local -xf "$archive"
          fi
          rm -- "$archive"
      - name: Inspect available build memory and disk
        shell: pwsh
        run: |
          Get-PSDrive -Name C,D | Select-Object Name,Free,Used
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,TotalVirtualMemorySize,FreeVirtualMemory
      - name: Reserve virtual memory for compilation
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708
        with:
          minimum-size: 16GB
          maximum-size: 32GB
          disk-root: 'D:'
      - name: Verify compiler memory headroom
        shell: pwsh
        run: |
          $memory = Get-CimInstance Win32_OperatingSystem
          $memory | Select-Object TotalVisibleMemorySize,TotalVirtualMemorySize,FreeVirtualMemory
          Get-CimInstance Win32_PageFileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage
          if ($memory.TotalVirtualMemorySize -lt ($memory.TotalVisibleMemorySize + 16GB / 1KB)) {
            throw 'The runner did not allocate the required compiler paging space.'
          }
      - name: Build Release
        shell: cmd
        env:
          _CL_: /MP1 /FS
        run: |
          cd tdesktop\Telegram
          where cl
          where ninja
          call configure.bat -G "Ninja Multi-Config" qt6 ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_ENABLE_LTO=OFF ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b 1
          cmake --build ..\out --config Release --target Telegram --parallel 2
      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path tdesktop/out/Release/Telegram.exe -DestinationPath dist/tdesktop-without-widgets-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Record the source commit
        shell: bash
        run: |
          actual=$(git -C tdesktop rev-parse HEAD)
          test "$actual" = "$SOURCE_SHA"
          mkdir -p source
          printf '{"sha":"%s"}\n' "$actual" > source/source.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows-source
          path: source/source.json
          if-no-files-found: error
          retention-days: 30
