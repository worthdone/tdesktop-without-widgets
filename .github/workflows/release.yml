name: Publish release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit (empty uses the default branch tip)
        type: string
        required: false
      tag:
        description: Release tag (empty uses app version and source commit)
        type: string
        required: false
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: true
  workflow_run:
    workflows: [Release Linux x64, Release Windows x64, Release macOS universal]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check release assembly
        run: python3 .github/scripts/test_publish_release.py
      - name: Collect matching builds and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ github.event_name == 'workflow_run' || inputs.prerelease }}
        run: python3 .github/scripts/publish_release.py
