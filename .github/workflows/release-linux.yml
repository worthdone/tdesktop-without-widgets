name: Release Linux x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public credentials already used by this repository's nightly builds.
  TDESKTOP_API_ID: '611335'
  TDESKTOP_API_HASH: d524b414d21f4d37f08684c1df41ac9c

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Generate dependency image
        run: |
          python3 -m venv "$RUNNER_TEMP/docker-generator"
          "$RUNNER_TEMP/docker-generator/bin/pip" install jinja2
          cd Telegram/build/docker/centos_env
          DEBUG= LTO= "$RUNNER_TEMP/docker-generator/bin/python" gen_dockerfile.py > "$RUNNER_TEMP/Dockerfile"
          mv "$RUNNER_TEMP/Dockerfile" Dockerfile
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: tdesktop:release
          cache-from: type=gha,scope=release-linux
          cache-to: type=gha,scope=release-linux,mode=max
      - name: Build Release
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/usr/src/tdesktop" \
            -e CONFIG=Release \
            tdesktop:release \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D DESKTOP_APP_ENABLE_LTO=OFF \
            -D TDESKTOP_API_ID="$TDESKTOP_API_ID" \
            -D TDESKTOP_API_HASH="$TDESKTOP_API_HASH" \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
      - name: Package Linux
        run: |
          test -x out/Release/Telegram
          mkdir -p dist
          tar -cJf dist/tdesktop-without-widgets-linux-x64.tar.xz -C out/Release Telegram
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 30
